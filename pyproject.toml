[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-cursor-agent"
version = "0.1.0"
description = "Production Telegram remote coding-agent service using Cursor CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-redis>=4.6",
    "aiosqlite>=0.20",
]

[project.scripts]
telegram-cursor-agent = "telegram_cursor_agent.main:main"
telegram-cursor-worker = "telegram_cursor_agent.queue.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_cursor_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["telegram_cursor_agent"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true
